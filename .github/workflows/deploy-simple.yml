name: Deploy to GitHub Pages (Simple)

on:
  push:
    branches: [ main ]

# Add permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Validate Version Consistency
      run: |
        # Extract version from version.js
        VERSION_JS=$(grep "APP_VERSION = " version.js | sed "s/.*APP_VERSION = '\(.*\)';/\1/")
        echo "Version in version.js: $VERSION_JS"
        
        # Extract version from service worker (first CACHE_NAME line)
        SW_VERSION=$(grep "CACHE_NAME = " service-worker.js | head -1 | sed "s/.*robinson-limit-mp-v\([0-9]*\.[0-9]*\.[0-9]*\).*/\1/")
        echo "Version in service-worker.js: $SW_VERSION"
        
        # Check if versions match
        if [ "$VERSION_JS" != "$SW_VERSION" ]; then
          echo "❌ Version mismatch! version.js: $VERSION_JS, service-worker.js: $SW_VERSION"
          exit 1
        fi
        
        echo "✅ Version consistency validated: $VERSION_JS"
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Inject API Keys into config.js
      run: |
        # Create a production config that includes the window.config object
        cat > config.js << EOF
        // Production config with injected API keys
        window.config = {
            openWeatherMapApiKey: '${{ secrets.OPENWEATHER_API_KEY }}',
            weatherApiKey: '${{ secrets.WEATHERAPI_KEY }}',
            environment: 'production'
        };
        
        // Configuration file for API keys and settings
        const config = {
            // OpenWeatherMap API Key - load from window.config or fallback
            openWeatherMapApiKey: (() => {
                if (typeof window !== 'undefined' && window.config && window.config.openWeatherMapApiKey) {
                    return window.config.openWeatherMapApiKey;
                }
                return 'your_openweathermap_api_key_here';
            })(),
            
            // WeatherAPI.com API Key - load from window.config or fallback
            weatherApiKey: (() => {
                if (typeof window !== 'undefined' && window.config && window.config.weatherApiKey) {
                    return window.config.weatherApiKey;
                }
                return 'your_weatherapi_key_here';
            })(),
            
            // Weather API settings
            weatherSettings: {
                primaryApi: 'openweathermap',
                fallbackApis: ['wttr', 'weatherapi'],
                timeout: 10000,
                retryAttempts: 2
            }
        };

        // Export for use in other modules
        if (typeof module !== 'undefined' && module.exports) {
            module.exports = config;
        }
        EOF
        
        echo "✅ API keys injected into config.js"
        echo "✅ Production config generated with window.config object"
        
    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: .
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4 