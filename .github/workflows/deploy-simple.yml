name: Deploy to GitHub Pages (Simple)

on:
  push:
    branches: [ main ]

# Add permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Validate Version Consistency
      run: |
        # Extract version from version.js
        VERSION_JS=$(grep "APP_VERSION = " version.js | sed "s/.*APP_VERSION = '\(.*\)';/\1/")
        echo "Version in version.js: $VERSION_JS"
        
        # Extract version from service worker
        SW_VERSION=$(grep "CACHE_NAME = " service-worker.js | sed "s/.*robinson-limit-mp-v\([0-9]*\.[0-9]*\.[0-9]*\).*/\1/")
        echo "Version in service-worker.js: $SW_VERSION"
        
        # Check if versions match
        if [ "$VERSION_JS" != "$SW_VERSION" ]; then
          echo "❌ Version mismatch! version.js: $VERSION_JS, service-worker.js: $SW_VERSION"
          exit 1
        fi
        
        echo "✅ Version consistency validated: $VERSION_JS"
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Inject API Keys into config.js
      run: |
        # Check if secrets are available and inject them
        if [ -n "${{ secrets.OPENWEATHER_API_KEY }}" ]; then
          sed -i "s/your_openweathermap_api_key_here/${{ secrets.OPENWEATHER_API_KEY }}/g" config.js
          echo "OpenWeatherMap API key injected"
        else
          echo "Warning: OPENWEATHER_API_KEY secret not found"
        fi
        
        if [ -n "${{ secrets.WEATHERAPI_KEY }}" ]; then
          sed -i "s/your_weatherapi_key_here/${{ secrets.WEATHERAPI_KEY }}/g" config.js
          echo "WeatherAPI key injected"
        else
          echo "Warning: WEATHERAPI_KEY secret not found"
        fi
        
    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: .
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4 